# Explicitly isolated local pipeline test target. The safety configuration rejects
# datasource overrides before Flyway or Hibernate can open a connection.
spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/aisoc_test
spring.datasource.username=aisoc_test
spring.datasource.password=${AISOC_V2_TEST_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://127.0.0.1:55432/aisoc_test
spring.flyway.user=aisoc_test
spring.flyway.password=${AISOC_V2_TEST_PASSWORD}
spring.flyway.baseline-on-migrate=false
server.address=127.0.0.1
server.port=8082
aisoc.detection-worker.enabled=true
aisoc.investigation-worker.enabled=false
